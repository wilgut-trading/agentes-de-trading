# Push a main: pruebas de contrato, respaldo si cambia la version, imagen nueva y despliegue.
name: Desplegar
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
permissions: {contents: read, id-token: write}
concurrency: {group: desplegar}
jobs:
  desplegar:
    if: vars.GCP_PROYECTO != ''
    runs-on: ubuntu-latest
    environment: produccion   # sus secretos solo existen aqui y solo para main
    env:
      PROYECTO: ${{ vars.GCP_PROYECTO }}
      REGION: us-central1
      IMAGEN: us-central1-docker.pkg.dev/${{ vars.GCP_PROYECTO }}/agentes/agentes:${{ github.sha }}
      BUCKET: ${{ vars.AGENTES_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Pruebas (si fallan, no se despliega)
        run: |
          uv venv --python 3.13 && uv pip install -e . -r web/requirements.txt pytest httpx
          .venv/bin/python -m pytest web/tests motor/tests -q
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CUENTA_DESPLIEGUE }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Imagen
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev -q
          docker build -t agentes-base .
          docker build -f Dockerfile.web --build-arg BASE=agentes-base -t "$IMAGEN" .
          docker push "$IMAGEN"
      - name: Respaldo si cambia la version de TradingAgents
        run: |
          VERSION=$(cat VERSION_BASE.txt)
          ANTERIOR=$(gcloud storage cat "gs://$BUCKET/respaldos/version.txt" 2>/dev/null || true)
          if [ "$VERSION" != "$ANTERIOR" ] && [ -n "$ANTERIOR" ]; then
            FECHA=$(date +%F)
            gcloud storage rsync -r -x 'chatgpt-auth\.json$' "gs://$BUCKET/private/tradingagents" "gs://$BUCKET/respaldos/$FECHA-$VERSION"
            echo "{\"fecha\":\"$FECHA\",\"version\":\"$VERSION\"}" | gcloud storage cp - "gs://$BUCKET/respaldos/ultimo.json"
          fi
          echo "$VERSION" | gcloud storage cp - "gs://$BUCKET/respaldos/version.txt"
      - name: Motor y web
        env:
          ANALISTAS: ${{ vars.AGENTES_ANALISTAS }}
          PROFUNDO: ${{ vars.MODELO_PROFUNDO }}
          RAPIDO: ${{ vars.MODELO_RAPIDO }}
          IDIOMA: ${{ vars.IDIOMA_INFORMES }}
          SEC: ${{ secrets.SEC_EDGAR_USER_AGENT }}
          FRED: ${{ secrets.FRED_API_KEY }}
          TYPESAFE: ${{ secrets.TYPESAFE_API_KEY }}
          CORREOS: ${{ secrets.AGENTES_CORREOS }}
          ORIGENES: ${{ vars.AGENTES_ORIGENES }}
          FB_KEY: ${{ vars.FIREBASE_APIKEY }}
        run: |
          # ^;^ cambia el separador: AGENTES_ANALISTAS lleva comas.
          COMUNES="^;^AGENTES_BUCKET=$BUCKET;AGENTES_AMBIENTE=prod;GOOGLE_CLOUD_PROJECT=$PROYECTO;AGENTES_ANALISTAS=$ANALISTAS;TRADINGAGENTS_DEEP_THINK_LLM=$PROFUNDO;TRADINGAGENTS_QUICK_THINK_LLM=$RAPIDO;TRADINGAGENTS_OUTPUT_LANGUAGE=$IDIOMA;SEC_EDGAR_USER_AGENT=$SEC;AGENTES_CORREOS=$CORREOS;AGENTES_ORIGENES=$ORIGENES;FIREBASE_APIKEY=$FB_KEY;FIREBASE_AUTHDOMAIN=$PROYECTO.web.app;FIREBASE_PROJECTID=$PROYECTO"
          gcloud run jobs deploy agentes-motor --region "$REGION" --image "$IMAGEN" --command python --args=-m,motor.run --tasks 1 --parallelism 1 --max-retries 0 --task-timeout 6h --service-account "agentes-motor@$PROYECTO.iam.gserviceaccount.com" --update-env-vars "$COMUNES;FRED_API_KEY=$FRED;TYPESAFE_API_KEY=$TYPESAFE"
          gcloud run deploy agentes-web --region "$REGION" --image "$IMAGEN" --min-instances 0 --max-instances 2 --allow-unauthenticated --service-account "agentes-web@$PROYECTO.iam.gserviceaccount.com" --update-env-vars "$COMUNES"
          # Una vista previa fija el trafico: sin esto, lo nuevo se quedaria en 0 %.
          gcloud run services update-traffic agentes-web --region "$REGION" --to-latest
      - name: Hosting
        run: npx -y firebase-tools@14 deploy --only hosting,storage --project "$PROYECTO" --non-interactive
      - name: Borrar vista previa
        run: |
          AGENTES_BUCKET="$BUCKET" .venv/bin/python -m motor.run --cerrar-preview
          gcloud run jobs delete agentes-motor-preview --region "$REGION" -q || true
          gcloud run services update-traffic agentes-web --region "$REGION" --remove-tags preview || true
