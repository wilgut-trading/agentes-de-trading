# Solo avisa: nunca fusiona ni despliega a produccion. El codigo de la version nueva todavia no
# es de confianza, asi que cada paso tiene solo el permiso que necesita:
#   preparar y avisar escriben en el repo, pero nunca ejecutan ese codigo.
#   probar lo ejecuta, sin credenciales de ningun tipo.
#   vista-previa lo despliega, solo despues de tu aprobacion en el ambiente "vista-previa".
name: Nueva version de TradingAgents
on:
  schedule: [{cron: "0 13 * * 1"}]
  workflow_dispatch:
    inputs:
      version: {description: "Versión concreta (por ejemplo v0.7.2). Vacío = la última.", required: false}
permissions: {}
jobs:
  preparar:
    runs-on: ubuntu-latest
    permissions: {contents: write, pull-requests: read}
    outputs:
      seguir: ${{ steps.v.outputs.seguir }}
      nueva: ${{ steps.v.outputs.nueva }}
      actual: ${{ steps.v.outputs.actual }}
      rama: ${{ steps.v.outputs.rama }}
      conflicto: ${{ steps.m.outputs.conflicto }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Comparar versiones
        id: v
        env: {GH_TOKEN: "${{ github.token }}", ELEGIDA: "${{ inputs.version }}"}
        run: |
          ACTUAL=$(cat VERSION_BASE.txt)
          NUEVA="${ELEGIDA:-$(gh api repos/TauricResearch/TradingAgents/releases/latest --jq .tag_name)}"
          case "$NUEVA" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "Versión no válida"; exit 1;; esac
          RAMA="actualizacion/$NUEVA"
          { echo "nueva=$NUEVA"; echo "actual=$ACTUAL"; echo "rama=$RAMA"; } >> "$GITHUB_OUTPUT"
          SEGUIR=true
          [ "$NUEVA" = "$ACTUAL" ] && SEGUIR=false
          # Una version descartada (PR cerrado sin fusionar) no se vuelve a proponer, salvo a mano.
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ -n "$(gh pr list --head "$RAMA" --state closed --json number --jq '.[0].number')" ]; then SEGUIR=false; fi
          echo "seguir=$SEGUIR" >> "$GITHUB_OUTPUT"
      - name: Fusionar ese tag en una rama (git no ejecuta el codigo)
        if: steps.v.outputs.seguir == 'true'
        id: m
        env:
          NUEVA: ${{ steps.v.outputs.nueva }}
          RAMA: ${{ steps.v.outputs.rama }}
          # GITHUB_TOKEN no puede subir cambios en .github/workflows; si la version los trae, hace falta este.
          TOKEN: ${{ secrets.TOKEN_ACTUALIZACION || github.token }}
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/TauricResearch/TradingAgents.git
          git fetch upstream "refs/tags/$NUEVA:refs/tags/$NUEVA"
          # Si la rama ya existe se continua sobre ella, sin forzar: puede tener tus ajustes.
          if git rev-parse -q --verify "refs/remotes/origin/$RAMA" >/dev/null; then git switch -C "$RAMA" "origin/$RAMA"; else git switch -C "$RAMA"; fi
          CONFLICTO=false
          git merge --no-edit "$NUEVA" || { CONFLICTO=true; git merge --abort; }
          echo "conflicto=$CONFLICTO" >> "$GITHUB_OUTPUT"
          if [ "$CONFLICTO" = true ]; then
            # Sin subir de version: sin el codigo nuevo, anotarla falsearia lo instalado.
            git commit --allow-empty -m "La fusion de TradingAgents $NUEVA tiene conflictos"
          else
            echo "$NUEVA" > VERSION_BASE.txt; git add VERSION_BASE.txt; git commit -m "Propone TradingAgents $NUEVA" || true
          fi
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$RAMA"
  probar:
    needs: preparar
    if: needs.preparar.outputs.seguir == 'true' && needs.preparar.outputs.conflicto == 'false'
    runs-on: ubuntu-latest
    permissions: {contents: read}
    outputs:
      original: ${{ steps.t.outputs.original }}
      contrato: ${{ steps.t.outputs.contrato }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ needs.preparar.outputs.rama }}", persist-credentials: false}
      - id: t
        run: |
          pip install uv && uv venv --python 3.13 && uv pip install -e . -r web/requirements.txt pytest pytest-subtests httpx
          .venv/bin/python -m pytest tests -q > original.txt 2>&1 && echo "original=ok" >> "$GITHUB_OUTPUT" || echo "original=falla" >> "$GITHUB_OUTPUT"
          .venv/bin/python -m pytest web/tests/test_contrato.py -q > contrato.txt 2>&1 && echo "contrato=ok" >> "$GITHUB_OUTPUT" || echo "contrato=falla" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with: {name: pruebas, path: "*.txt", if-no-files-found: ignore}
  avisar:
    needs: [preparar, probar]
    if: always() && needs.preparar.outputs.seguir == 'true'
    runs-on: ubuntu-latest
    permissions: {contents: read, pull-requests: write, actions: read}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: {name: pruebas}
      - name: PR en borrador
        env:
          # La organizacion no deja que GITHUB_TOKEN cree PRs. Este paso no ejecuta nada de la rama.
          GH_TOKEN: ${{ secrets.TOKEN_ACTUALIZACION || github.token }}
          NUEVA: ${{ needs.preparar.outputs.nueva }}
          ACTUAL: ${{ needs.preparar.outputs.actual }}
          RAMA: ${{ needs.preparar.outputs.rama }}
          CONFLICTO: ${{ needs.preparar.outputs.conflicto }}
          ORIGINAL: ${{ needs.probar.outputs.original }}
          CONTRATO: ${{ needs.probar.outputs.contrato }}
        run: |
          git fetch -q https://github.com/TauricResearch/TradingAgents.git "refs/tags/$NUEVA:refs/tags/$NUEVA" "refs/tags/$ACTUAL:refs/tags/$ACTUAL" || true
          {
            echo "## TradingAgents $ACTUAL → $NUEVA"
            echo; echo "**Nada se instala hasta que lo apruebes.** Pasos en ACTUALIZAR.md."
            [ "$CONFLICTO" = true ] && echo && echo "🔴 **La fusión tiene conflictos**: hay que resolverlos antes de probar."
            [ "$CONTRATO" = falla ] && echo && echo "🔴 **Tests de contrato en rojo.** Pantallas afectadas abajo."
            echo; echo "- Pruebas del proyecto original: ${ORIGINAL:-no ejecutadas}"; echo "- Tests de contrato: ${CONTRATO:-no ejecutados}"
            echo "- Vista previa: pendiente de tu aprobación en la pestaña Actions de esta corrida."
            echo; echo "### Novedades"; git show "$NUEVA:CHANGELOG.md" 2>/dev/null | awk -v a="${ACTUAL#v}" 'index($0,"## ")==1 && index($0,a){exit} {print}' | head -150
            echo; echo "### Archivos originales que cambiaron"; echo '```'; git diff --stat "refs/tags/$ACTUAL" "refs/tags/$NUEVA" 2>/dev/null | tail -40; echo '```'
            [ -f contrato.txt ] && { echo "### Tests de contrato"; echo '```'; tail -30 contrato.txt; echo '```'; }
          } > cuerpo.md
          if [ -n "$(gh pr list --head "$RAMA" --state open --json number --jq '.[0].number')" ]; then
            gh pr edit "$RAMA" --body-file cuerpo.md
          else
            gh pr create --draft --head "$RAMA" --title "Actualizar TradingAgents a $NUEVA" --body-file cuerpo.md
          fi
  vista-previa:
    needs: [preparar, probar, avisar]
    if: needs.probar.outputs.contrato == 'ok' && vars.GCP_PROYECTO != ''
    runs-on: ubuntu-latest
    environment: vista-previa   # con revisor obligatorio: no corre hasta que lo apruebes
    env:
      PROFUNDO: ${{ vars.MODELO_PROFUNDO }}
      RAPIDO: ${{ vars.MODELO_RAPIDO }}
      IDIOMA: ${{ vars.IDIOMA_INFORMES }}
      ANALISTAS: ${{ vars.AGENTES_ANALISTAS }}
    permissions: {contents: read, id-token: write, pull-requests: write}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ needs.preparar.outputs.rama }}", persist-credentials: false}
      - id: p
        uses: ./.github/acciones/vista-previa
        with:
          proyecto: ${{ vars.GCP_PROYECTO }}
          proveedor: ${{ vars.GCP_WIF_PROVIDER }}
          cuenta: ${{ vars.GCP_CUENTA_DESPLIEGUE }}
          bucket: ${{ vars.AGENTES_BUCKET }}
      - env: {GH_TOKEN: "${{ github.token }}", RAMA: "${{ needs.preparar.outputs.rama }}", URL: "${{ steps.p.outputs.url }}"}
        run: |
          gh pr comment "$RAMA" --body "Vista previa lista: $URL"
