{% extends "base.html" %}{% block cuerpo %}
<h1>Informes</h1>
<form method="get" class="filtros"><input name="ticker" value="{{ ticker }}" placeholder="Ticker"><button>Filtrar</button></form>
{% for t in lista %}<a class="fila" href="/analisis/{{ t.id }}"><b>{{ t.ticker }}</b> {{ t.fecha }} <span>{{ t.rating }}</span><span class="v v-{{ t.veredicto[:2] }}">{{ t.veredicto }}</span></a>{% else %}<p class="nota">Sin informes.</p>{% endfor %}
{% endblock %}
